plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'com.flybrain.survival'
    compileSdk 34
    defaultConfig {
        applicationId "com.flybrain.survival"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1"
        ndk { abiFilters "arm64-v8a" }   // только arm64: Nothing Phone 2a и современные
        python {
            version "3.11"
            pip {
                install "numpy"
                install "pillow"
                // onnxruntime: нет chaquopy-колеса -> нативный AAR (dependencies);
                // Java-мост — ВСТРОЕННЫЙ модуль java Chaquopy (pyjnius не нужен)
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // зрение в APK: нативный onnxruntime-android (мост через pyjnius,
    // см. image_embedder._run_jni). Базы видов — в app/src/main/assets/state/.
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.19.0"
}
