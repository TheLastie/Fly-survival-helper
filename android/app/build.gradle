plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.flybrain.survival'
    compileSdk 34
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId "com.flybrain.survival"
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName "1.1"
        ndk { abiFilters "arm64-v8a" }
        python {
            version "3.11"
            pip {
                install "numpy"
                install "pillow"
            }
        }
    }
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "flybrain123"
            keyAlias "flybrain"
            keyPassword "flybrain123"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    // BISECT B1: onnxruntime AAR отключён. Для зрения раскомментировать:
    // implementation "com.microsoft.onnxruntime:onnxruntime-android:1.30.0"
}
