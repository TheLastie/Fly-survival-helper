# Сборка APK в облаке: закоммитьте проект на GitHub — APK появится
# во вкладке Actions как артефакт. Ничего локально не устанавливать.
name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # кнопка "Run workflow" в веб-интерфейсе GitHub

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [lite, full]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest уже содержит полный Android SDK (ANDROID_HOME);
      # setup-android action больше не нужен (ломается на cmdline-tools 16)
      - name: Лицензии + платформа 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.10 (Chaquopy несовместим с Gradle 9)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Синхронизация Python payload (root -> android)
        run: for f in *.py; do cp "$f" android/app/src/main/python/flybrain/; done

      - name: Собрать debug APK (${{ matrix.flavor }})
        run: cd android && gradle assemble${{ matrix.flavor }}Debug --stacktrace

      - name: Выложить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: flybrain-${{ matrix.flavor }}
          path: android/app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
